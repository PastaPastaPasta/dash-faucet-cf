name: Validate and deploy faucet

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Build Worker
        run: npx wrangler deploy --env testnet --dry-run --outdir dist

  deploy:
    name: Deploy testnet
    needs: validate
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: testnet
      url: https://faucet.dashhq.org
    concurrency:
      group: faucet-testnet-deployment
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Check deployment revision
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/master" --jq .sha)
          if [ "$latest_sha" = "$GITHUB_SHA" ]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Skipping superseded revision.'
          fi
      - name: Deploy Worker and assets
        if: steps.revision.outputs.current == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          # Login credentials. GitHub reserves the GITHUB_ prefix for its own
          # secrets, hence the OAUTH_ names on that side.
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GITHUB_CLIENT_ID: ${{ secrets.OAUTH_GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.OAUTH_GITHUB_CLIENT_SECRET }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo '::error::Set the CLOUDFLARE_API_TOKEN Actions secret and CLOUDFLARE_ACCOUNT_ID Actions variable in repository settings.'
            exit 1
          fi
          # Upload whichever login secrets are set, alongside the deploy.
          # Additive: secrets set directly with `wrangler secret put` survive.
          secrets_file="$RUNNER_TEMP/worker-secrets.json"
          node -e '
            const names = ["SESSION_SECRET", "GOOGLE_CLIENT_ID", "GOOGLE_CLIENT_SECRET", "GITHUB_CLIENT_ID", "GITHUB_CLIENT_SECRET"];
            const set = Object.fromEntries(names.filter((n) => process.env[n]).map((n) => [n, process.env[n]]));
            require("fs").writeFileSync(process.argv[1], JSON.stringify(set), { mode: 0o600 });
            console.log(`Uploading ${Object.keys(set).length} login secret(s): ${Object.keys(set).join(", ") || "none"}`);
          ' "$secrets_file"
          if [ "$(cat "$secrets_file")" = "{}" ]; then
            npm run deploy:testnet
          else
            npm run deploy:testnet -- --secrets-file "$secrets_file"
          fi
          rm -f "$secrets_file"
      - name: Verify public faucets
        if: steps.revision.outputs.current == 'true'
        run: |
          for host in faucet.dashhq.org faucet.thepasta.org; do
            curl --fail --silent --show-error --max-time 20 \
              --retry 4 --retry-all-errors --retry-delay 5 "https://$host/api/status" |
              node --input-type=module -e '
                let body = "";
                for await (const chunk of process.stdin) body += chunk;
                const status = JSON.parse(body);
                if (status.network !== "testnet" || !["ok", "low_balance"].includes(status.status)) {
                  throw new Error("Faucet status check failed");
                }
                console.log("Testnet faucet is responding");
              '
          done
